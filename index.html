<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RifaControl">
<meta name="application-name" content="RifaControl">
<meta name="theme-color" content="#00b894">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Controle suas rifas com sincronização em tempo real">

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./assets/brand/logo.png">
<link rel="apple-touch-icon" href="./assets/brand/logo.png">

<link rel="stylesheet" href="./src/styles/main.css">

<title>RifaControl 🎟️</title>
</head>
<body>

<!-- ============================================================
     AUTH SCREEN
     ============================================================ -->
<div class="auth-screen" id="auth-screen">
  <div class="auth-bg" style="background-image: url('./assets/brand/login-bg.jpg');"></div>
  <div class="auth-overlay"></div>
  <div class="auth-container">
    <div class="auth-brand">
      <img src="./assets/brand/logo.png" alt="RifaControl" class="auth-brand-logo">
      <h1 class="auth-brand-title">RifaControl</h1>
      <p class="auth-brand-sub">Suas rifas na nuvem, compartilhadas</p>
    </div>
    <div class="auth-card" id="auth-card-container">
      <!-- Injetado via JS -->
    </div>
  </div>
</div>

<!-- ============================================================
     APP
     ============================================================ -->
<div class="app hidden" id="app">
  <!-- Sidebar (Injetada via JS) -->
  <div id="sidebar-container"></div>

  <!-- Telas (Injetadas via JS) -->
  <div class="screens" id="app-screens"></div>
</div>

<!-- ============================================================
     MODAIS E OVERLAYS GLOBAIS (Fora do .app)
     ============================================================ -->
<div id="modals-container"></div>

<div class="toast" id="toast"></div>
<div class="confetti-container" id="confetti-container"></div>

<script type="module" src="./src/main.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
